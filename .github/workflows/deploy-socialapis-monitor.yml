
name: Deploy SocialAPIs Monitor

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/socialapis-monitor/**"
      - ".github/workflows/deploy-socialapis-monitor.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-socialapis-monitor
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify function files
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/socialapis-monitor/index.ts
          echo "Function source file found."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          supabase functions deploy socialapis-monitor \
            --project-ref eaqkcnqgaasopqzkhohv \
            --yes

      - name: Deployment completed
        if: success()
        run: echo "SocialAPIs Monitor deployment completed."
