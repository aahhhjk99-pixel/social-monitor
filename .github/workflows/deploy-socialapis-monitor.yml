
name: Deploy SocialAPIs Monitor

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/socialapis-monitor/**"
      - ".github/workflows/deploy-socialapis-monitor.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy socialapis-monitor \
            --project-ref eaqkcnqgaasopqzkhohv
